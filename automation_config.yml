provider:
  name: ollama
  base_url: http://localhost:11434/v1
  model: llama3
  options: {}
max_steps: 5
safety:
  blocked_terms:
    - drop production database
tools:
  custom_python:
    description: Example inline python tool
    script: |
      result = f"Processed {args.get('item', 'unknown item')}"
      state.setdefault('custom', []).append(result)
      output = result
