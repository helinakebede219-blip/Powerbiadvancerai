[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-advancer-agent"
version = "0.1.0"
description = "Agent framework for automating Power BI and data workflows from prompts."
authors = [{name = "PowerBI Advancer AI"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "typing-extensions>=4.8"
]

[project.optional-dependencies]
openai = ["openai>=1.13.0"]
llama = ["llama-cpp-python>=0.2.26"]
mcp = ["mcp>=0.1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
